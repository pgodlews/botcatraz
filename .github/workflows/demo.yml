name: Demo

# Builds the sample site (invented records, documentation-range addresses only)
# and publishes it with GitHub Pages. The sample moves with the clock, so the
# hourly rebuild brings new arrivals and releases, like a real server would.
on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the sample site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./build.py --sample --www site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish it
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

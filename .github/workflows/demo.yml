name: Demo

# Builds the sample site (invented records, documentation-range addresses only)
# and publishes it with GitHub Pages, on every push to main. "Run workflow" on
# the Actions tab builds it again by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the sample site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./build.py --sample --www site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish it
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

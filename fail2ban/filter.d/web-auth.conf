# Install as /etc/fail2ban/filter.d/web-auth.conf.
#
# For a web site where every legitimate request carries a token, and nginx logs
# whether it did (auth=ok or auth=deny; see README.md in this folder for the
# log_format). A failure is a request without a valid token that nginx turned
# away. Requests with a valid token are never counted, whatever the application
# answers.
#
# Ignored: anything under /.well-known/ (certificate checks, and discovery
# requests that clients send before they have a token), and what an ordinary
# browser or a polite crawler asks any web server for, unprompted. Looking at
# the front door is not an attack. That is a GET or HEAD for exactly one of:
#   /  /index.html  /index.htm
#   /favicon.ico  /favicon.png  /favicon.svg  /apple-touch-icon(-precomposed).png
#   /robots.txt  /sitemap.xml  /ads.txt  /humans.txt  /security.txt
# "/" with a query string, any other path, any other method and malformed
# requests still count, and so does reaching a real path without a token.
# jail-records uses the same list (POLITE in server/jail-records) to decide what
# is a knock; keep the two in step.
[Definition]
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S%%z
failregex   = ^\s*<HOST> "[^"]*" (?:400|401|403|404|405) \d+ auth=deny\b
ignoreregex = ^\s*<HOST> "\S+ \S*/\.well-known/
              ^\s*<HOST> "(?:GET|HEAD) /(?:(?:index\.html?|favicon\.(?:ico|png|svg)|apple-touch-icon(?:-precomposed)?\.png|robots\.txt|sitemap\.xml|ads\.txt|humans\.txt|security\.txt)(?:\?\S*)?)? HTTP

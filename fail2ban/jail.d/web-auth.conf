# Install as /etc/fail2ban/jail.d/web-auth.conf.
# Bans web ports only, so a ban here can never lock anyone out of SSH.
# Two requests without a valid token in 10 minutes: banned for 24 hours.
# With bantime.increment set in jail.local, repeat offenders go 1 day, 2 days,
# 4 days, then 7 days.
[web-auth]
enabled  = true
filter   = web-auth
backend  = auto
logpath  = /var/log/nginx/protected.access.log
port     = http,https
maxretry = 2
findtime = 600
bantime  = 86400
